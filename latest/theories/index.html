<script>
function pick(el){
  document.querySelectorAll('.thx').forEach(function(b){b.classList.toggle('active',b===el);});
  var slug=el.dataset.slug;
  document.getElementById('thframe').src=slug+'.html';
  // Update the URL hash so the current view is shareable. replaceState
  // avoids cluttering history — back button still goes to the previous
  // PAGE rather than walking through every theory clicked.
  try{
    if((location.hash||'').replace('#','')!==slug){
      history.replaceState(null,'','#'+slug);
    }
  }catch(e){}
  // Surface the "copy link" button in the topbar once a theory is picked.
  var btn=document.getElementById('copy-theory-link');
  if(btn){btn.hidden=false; btn.classList.remove('copied');
    document.getElementById('copy-theory-label').textContent='copy link';}
}
function copyTheoryLink(){
  // Build the canonical direct URL — /latest/theories/<slug>.html — which
  // works even without JS, instead of the #fragment version. That's the
  // version someone pasting in a chat / email expects to see.
  var active=document.querySelector('.thx.active');
  if(!active) return;
  var slug=active.dataset.slug;
  // Same directory as this index.html (so it works under any host).
  var here=location.href.replace(/[#?].*$/,'');
  var base=here.substring(0, here.lastIndexOf('/')+1);
  var url=base+slug+'.html';
  var done=function(){
    var btn=document.getElementById('copy-theory-link');
    var lbl=document.getElementById('copy-theory-label');
    if(btn){btn.classList.add('copied');}
    if(lbl){lbl.textContent='✓ copied';}
    setTimeout(function(){
      if(btn){btn.classList.remove('copied');}
      if(lbl){lbl.textContent='copy link';}
    },1800);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(function(){
      window.prompt('Copy this link:',url);
    });
  }else{
    var ta=document.createElement('textarea');
    ta.value=url; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy'); done();}
    catch(e){window.prompt('Copy this link:',url);}
    document.body.removeChild(ta);
  }
}
function filt(){
  var q=document.getElementById('thsearch').value.trim().toLowerCase(),n=0;
  document.querySelectorAll('.thx').forEach(function(b){
    var hit=!q||(b.dataset.search||'').indexOf(q)!==-1;
    b.style.display=hit?'':'none'; if(hit)n++;
  });
  document.querySelectorAll('.thgrp').forEach(function(g){g.style.display=q?'none':'';});
  document.getElementById('thcount').textContent=n;
  document.getElementById('thnone').style.display=n?'none':'block';
}
// Deep-link support: /latest/theories/index.html#<slug> opens with that
// theory pre-selected. Used by external links (chat / email / social) so
// people land on the right card instead of the default.
(function bootDeepLink(){
  var slug=(location.hash||'').replace('#','').trim();
  if(slug){
    var btn=document.querySelector('.thx[data-slug="'+slug+'"]');
    if(btn){pick(btn); btn.scrollIntoView({block:'center'}); return;}
  }
  var f=document.querySelector('.thx'); if(f) f.classList.add('active');
})();
// React to hash changes (same page, different theory targeted).
window.addEventListener('hashchange',function(){
  var slug=(location.hash||'').replace('#','').trim();
  if(slug){
    var btn=document.querySelector('.thx[data-slug="'+slug+'"]');
    if(btn) pick(btn);
  }
});
</script>
